<text x="992" y="584" font-size="14.5" font-weight="700" fill="#111827">Generate pass</text>
<text x="992" y="602" font-size="12.5" fill="#4b5563">Unique pass number,</text>
<text x="992" y="618" font-size="12.5" fill="#4b5563">QR code and PDF</text>
<rect x="1358" y="536" width="160" height="88" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<rect x="1368" y="546" width="30" height="20" rx="10" fill="#6d28d9"/>
<text x="1383.0" y="560.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">10</text>
<text x="1368" y="584" font-size="14.5" font-weight="700" fill="#111827">Validate &amp; log</text>
<text x="1368" y="602" font-size="12.5" fill="#4b5563">Checks status and</text>
<text x="1368" y="618" font-size="12.5" fill="#4b5563">validity; logs time</text>
<rect x="1170" y="726" width="160" height="88" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<rect x="1180" y="736" width="22" height="20" rx="10" fill="#b45309"/>
<text x="1191.0" y="750.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">8</text>
<text x="1180" y="774" font-size="14.5" font-weight="700" fill="#111827">Scan QR</text>
<text x="1180" y="792" font-size="12.5" fill="#4b5563">Check-in at</text>
<text x="1180" y="808" font-size="12.5" fill="#4b5563">the entrance</text>
<rect x="1358" y="726" width="160" height="88" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<rect x="1368" y="736" width="22" height="20" rx="10" fill="#b45309"/>
<text x="1379.0" y="750.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">9</text>
<text x="1368" y="774" font-size="14.5" font-weight="700" fill="#111827">Check-out</text>
<text x="1368" y="792" font-size="12.5" fill="#4b5563">Scan again on exit;</text>
<text x="1368" y="808" font-size="12.5" fill="#4b5563">pass marked used</text>
<text x="990" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#334155" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">approve</text>
<text x="820" y="570" text-anchor="middle" font-size="13" font-weight="600" fill="#334155" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">walk-in shortcut</text>
<text x="1102" y="400" text-anchor="start" font-size="13" font-weight="600" fill="#334155" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">emailed + shown</text>
<text x="1428" y="680" text-anchor="end" font-size="13" font-weight="600" fill="#334155" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">every scan</text>
<text x="1428" y="490" text-anchor="end" font-size="13" font-weight="600" fill="#334155" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">reports</text>
