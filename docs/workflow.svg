<text x="251.0" y="180.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
<text x="240" y="204" font-size="14.5" font-weight="700" fill="#111827">Sign up</text>
<text x="240" y="222" font-size="12.5" fill="#4b5563">Name, email, phone</text>
<rect x="418" y="156" width="160" height="88" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<rect x="428" y="166" width="22" height="20" rx="10" fill="#2563eb"/>
