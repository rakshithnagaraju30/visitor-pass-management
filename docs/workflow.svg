<path d="M40 913 H90" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="102" y="918" font-size="13.5" fill="#374151">Main flow (numbered in order)</text>
<path d="M330 913 H380" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="392" y="918" font-size="13.5" fill="#374151">Walk-in shortcut: staff register the visitor and issue the pass in one step</text>
<text x="40" y="953" font-size="13.5" fill="#374151"><tspan font-weight="700">A, B</tspan> one-time organization setup  ·  <tspan font-weight="700">Rejected</tspan> requests show the reason on the visitor dashboard  ·  Visitors can <tspan font-weight="700">cancel</tspan>, which revokes the pass  ·  Every role signs in with JWT and sees only its own organization</text>
