<text x="251.0" y="370.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
<text x="240" y="394" font-size="14.5" font-weight="700" fill="#111827">Create organization</text>
<text x="240" y="412" font-size="12.5" fill="#4b5563">Admin account</text>
<text x="240" y="428" font-size="12.5" fill="#4b5563">is set up</text>
<rect x="418" y="346" width="160" height="88" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<rect x="428" y="356" width="22" height="20" rx="10" fill="#047857"/>
<text x="439.0" y="370.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">B</text>
<text x="428" y="394" font-size="14.5" font-weight="700" fill="#111827">Add staff</text>
<text x="428" y="412" font-size="12.5" fill="#4b5563">Employees and</text>
<text x="428" y="428" font-size="12.5" fill="#4b5563">security users</text>
<rect x="606" y="346" width="160" height="88" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="616" y="356" width="36" height="20" rx="10" fill="#047857"/>
<text x="634.0" y="370.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Alt</text>
<text x="616" y="394" font-size="14.5" font-weight="700" fill="#111827">Walk-in visitor</text>
<text x="616" y="412" font-size="12.5" fill="#4b5563">Register visitor and</text>
<text x="616" y="428" font-size="12.5" fill="#4b5563">issue pass directly</text>
<rect x="794" y="346" width="160" height="88" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<rect x="804" y="356" width="22" height="20" rx="10" fill="#047857"/>
<text x="815.0" y="370.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
<text x="804" y="394" font-size="14.5" font-weight="700" fill="#111827">Review request</text>
<text x="804" y="412" font-size="12.5" fill="#4b5563">Approve, or reject</text>
<text x="804" y="428" font-size="12.5" fill="#4b5563">with a reason</text>
<rect x="1358" y="346" width="160" height="88" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<rect x="1368" y="356" width="30" height="20" rx="10" fill="#047857"/>
<text x="1383.0" y="370.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">11</text>
<text x="1368" y="394" font-size="14.5" font-weight="700" fill="#111827">Admin dashboard</text>
<text x="1368" y="412" font-size="12.5" fill="#4b5563">Search, filters</text>
<text x="1368" y="428" font-size="12.5" fill="#4b5563">and analytics</text>
<rect x="982" y="536" width="160" height="88" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<rect x="992" y="546" width="22" height="20" rx="10" fill="#6d28d9"/>
