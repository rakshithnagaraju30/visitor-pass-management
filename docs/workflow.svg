<text x="1180" y="222" font-size="12.5" fill="#4b5563">Show QR pass</text>
<text x="1180" y="238" font-size="12.5" fill="#4b5563">at the entrance</text>
<rect x="230" y="346" width="160" height="88" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
