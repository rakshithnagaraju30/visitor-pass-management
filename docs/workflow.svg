<text x="428" y="204" font-size="14.5" font-weight="700" fill="#111827">Verify email</text>
<text x="428" y="222" font-size="12.5" fill="#4b5563">6-digit OTP code</text>
<rect x="606" y="156" width="160" height="88" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<rect x="616" y="166" width="22" height="20" rx="10" fill="#2563eb"/>
<text x="627.0" y="180.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
<text x="616" y="204" font-size="14.5" font-weight="700" fill="#111827">Request a visit</text>
<text x="616" y="222" font-size="12.5" fill="#4b5563">Organization, date,</text>
<text x="616" y="238" font-size="12.5" fill="#4b5563">time and purpose</text>
<rect x="982" y="156" width="160" height="88" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<rect x="992" y="166" width="22" height="20" rx="10" fill="#2563eb"/>
<text x="1003.0" y="180.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
<text x="992" y="204" font-size="14.5" font-weight="700" fill="#111827">Receive pass</text>
<text x="992" y="222" font-size="12.5" fill="#4b5563">Email + QR &amp; PDF</text>
<text x="992" y="238" font-size="12.5" fill="#4b5563">in visitor dashboard</text>
<rect x="1170" y="156" width="160" height="88" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<rect x="1180" y="166" width="22" height="20" rx="10" fill="#2563eb"/>
