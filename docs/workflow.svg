<text x="40" y="58" font-size="30" font-weight="700" fill="#111827">VisitorPass: visit workflow</text>
<text x="40" y="88" font-size="16" fill="#6b7280">From a visitor&#8217;s request to check-out, across every role. Each organization&#8217;s data is kept separate.</text>
